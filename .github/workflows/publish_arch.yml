name: arch-build-action

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
      - "dev_v*"

jobs:
  build-arch:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    permissions:
      contents: write
    steps:
      # 安装基础工具（Actions 插件和 Flutter 依赖需要）
      - name: Prepare basic tools
        run: pacman -Syu --noconfirm git nodejs unzip base-devel jq curl which bash

      # 签出代码
      - uses: actions/checkout@v4

      # 安装 Arch 编译依赖
      - name: Install Dependencies
        run: pacman -S --noconfirm clang cmake ninja pkgconf gtk3 xz alsa-lib mpv

      # 解决 git 容器内的安全目录报错
      - name: Git safe directory
        run: git config --global --add safe.directory '*'

      # 设置 Flutter 环境
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          cache: true

      # 打开 Linux Desktop 支持
      - name: Enable Flutter Desktop
        run: flutter config --enable-linux-desktop

      # 更新 Flutter packages
      - name: Restore Packages
        run: |
          cd simple_live_app
          flutter pub get

      # 设置 flutter_distributor 环境
      - name: Install flutter_distributor
        run: dart pub global activate flutter_distributor

      # build Arch Linux ZIP
      - name: Build Arch
        run: |
          cd simple_live_app
          export PATH="$PATH":"$HOME/.pub-cache/bin"
          flutter_distributor package --platform linux --targets zip --skip-clean

      # 上传 Arch 包至 Artifacts
      - name: Upload Arch APP to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: archlinux
          path: |
            simple_live_app/build/dist/*/*.zip

      # 获取版本信息（自动从 Git Tag 提取）
      - name: Get version from tag
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=dev" >> $GITHUB_OUTPUT
          fi
      - name: Echo version
        run: echo "${{ steps.version.outputs.VERSION }}"

      # 上传至Release (仅针对 Tag 触发)
      - name: Upload Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          name: "${{ steps.version.outputs.VERSION }}"
          generate_release_notes: true
          prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'alpha') || contains(github.ref, 'dev') }}
          token: ${{ secrets.TOKEN }}
          files: |
            simple_live_app/build/dist/*/*.zip

      # 完成
      - run: echo "🍏 Arch Linux job's status is ${{ job.status }}."
